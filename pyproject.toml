[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-manager-local"
version = "0.10.0"
description = "Local read-only Drive model inventory, verified preparation, bounded TTS and fresh A/B comparisons"
requires-python = ">=3.10"
dependencies = ["requests==2.32.5"]

[project.scripts]
ai-manager = "ai_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_manager = ["static/index.html", "static/assets/*", "model_manifest*.json", "adapter_manifest*.json", "requirements_*.lock", "tapir_vendor/*.json", "tapir_vendor/LICENSE"]
